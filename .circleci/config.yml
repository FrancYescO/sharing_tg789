version: 2.1
jobs:
  build:
    working_directory: ~/build
    docker:
      - image: alpine/git
    steps:
      - run:
          name: Checkout source
          command: |
            git clone --filter=blob:none --no-checkout \
              "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git" .
            git checkout "${CIRCLE_SHA1}"
      - run:
          name: Build IPK
          command: |
            mkdir -p /tmp/artifacts
            sh ./ipkg-build.sh ./modgui-vpn /tmp/artifacts
            test -s /tmp/artifacts/modgui-vpn_1.1-0_all.ipk
            ! tar -tzf /tmp/artifacts/modgui-vpn_1.1-0_all.ipk | grep -E 'PaxHeader|/\._'
      - store_artifacts:
          path: /tmp/artifacts/modgui-vpn_1.1-0_all.ipk
          destination: modgui-vpn_1.1-0_all.ipk
