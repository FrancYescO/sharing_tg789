name: Build DumaOS Repack IPK

on:
  push:
    branches:
      - dumaos-repack
    tags:
      - "dumaos-repack-v*"
  pull_request:
    branches:
      - dumaos-repack
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package.outputs.package_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build IPK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 ./build_ipk.py

          packages=(dist/dumaos-repack_*.ipk)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          package_name="$(basename "$package")"
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"

      - name: Test transactional rollback
        shell: bash
        run: sh ./tests/test-ubus-transaction.sh

      - name: Verify reproducible build
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ steps.package.outputs.package_name }}"
          first_hash="$(sha256sum "$package" | awk '{print $1}')"
          rm -f "$package"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 ./build_ipk.py
          test "$first_hash" = "$(sha256sum "$package" | awk '{print $1}')"

      - name: Validate IPK
        shell: bash
        run: |
          set -euo pipefail
          package="dist/${{ steps.package.outputs.package_name }}"
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          test -s "$package"
          tar -tzf "$package" > "$work_dir/list.txt"
          grep -Eq '^(\./)?debian-binary$' "$work_dir/list.txt"
          grep -Eq '^(\./)?control\.tar\.gz$' "$work_dir/list.txt"
          grep -Eq '^(\./)?data\.tar\.gz$' "$work_dir/list.txt"
          ! grep -Eq 'PaxHeader|(^|/)\._' "$work_dir/list.txt"

          tar -xzf "$package" -C "$work_dir"
          mkdir -p "$work_dir/control" "$work_dir/data"
          tar -xzf "$work_dir/control.tar.gz" -C "$work_dir/control"
          tar -xzf "$work_dir/data.tar.gz" -C "$work_dir/data"

          test "$(awk -F ': ' '$1 == "Package" { print $2 }' "$work_dir/control/control")" = "dumaos-repack"
          version="$(awk -F ': ' '$1 == "Version" { print $2 }' "$work_dir/control/control")"
          architecture="$(awk -F ': ' '$1 == "Architecture" { print $2 }' "$work_dir/control/control")"
          test "$architecture" = "arm_cortex-a9"
          test "$(basename "$package")" = "dumaos-repack_${version}_${architecture}.ipk"

          for service in dumaos ndhttpd ndproxy ctwatch ctwatch-shim connwatch arpwatch dumaos_qos_tweaks; do
            test -x "$work_dir/data/etc/init.d/$service"
          done

          grep -q '/etc/init.d/ctwatch-shim restart' \
            "$work_dir/data/etc/hotplug.d/iface/80-ctwatch"
          ! grep -Eq '/etc/init.d/ctwatch restart' \
            "$work_dir/data/etc/hotplug.d/iface/80-ctwatch"
          grep -q '/etc/init.d/ctwatch-shim "$1"' \
            "$work_dir/data/etc/hotplug.d/dumaos/10-dumaos-launch"
          ! grep -q '/etc/init.d/ctwatch "$1"' \
            "$work_dir/data/etc/hotplug.d/dumaos/10-dumaos-launch"
          grep -q 'failed to register com.netdumasoftware.ctwatch' \
            "$work_dir/data/dumaos/ctwatch-shim.lua"
          grep -q 'procd_set_param respawn 3600 5 0' \
            "$work_dir/data/etc/init.d/dumaos"
          grep -q 'PASSES.*-lt.*3' \
            "$work_dir/data/etc/init.d/dumaos"
          grep -q 'killall -9 dpiclass dpiclass.bin' \
            "$work_dir/data/etc/init.d/dumaos"
          grep -q 'PASSES.*-lt.*3' \
            "$work_dir/data/dumaos/system_cleanup.sh"
          test -x "$work_dir/data/usr/lib/dumaos/platform/control.sh"
          grep -q '/usr/lib/dumaos/platform/control.sh.*>/dev/null 2>&1 &' \
            "$work_dir/data/usr/share/transformer/mappings/rpc/dumaos.map"
          grep -q 'cp /dumaossystem/version /www/data/shorthash' \
            "$work_dir/data/usr/lib/dumaos/platform/control.sh"
          cmp "$work_dir/data/www/cards/015_dumaos.lp" \
            "$work_dir/data/usr/share/modgui-dumaos/015_dumaos.lp"
          grep -q 'rpc.dumaos.enabled' \
            "$work_dir/data/www/cards/015_dumaos.lp"
          grep -q 'href="/desktop/"' \
            "$work_dir/data/www/cards/015_dumaos.lp"
          ! grep -q ':81' "$work_dir/data/www/cards/015_dumaos.lp"
          test -f "$work_dir/data/www/docroot/modals/dumaos-modal.lp"

          test -f "$work_dir/data/dumaos/api/cli.lua"
          test -f "$work_dir/data/dumaos/apps/system/com.netdumasoftware.procmanager/main.lua"
          test -f "$work_dir/data/www/ndindex.html"
          test -f "$work_dir/data/dumaossystem/model"

          test -x "$work_dir/data/usr/lib/dumaos/sbin/ndhttpd"
          test -f "$work_dir/data/usr/lib/ndhttpd_lua.so"
          test -f "$work_dir/data/usr/lib/lua/telemetrylua.so"
          test -f "$work_dir/data/usr/lib/lua/ndsiglua.so"
          test -f "$work_dir/data/usr/lib/telemetry.so"
          test -x "$work_dir/data/usr/lib/dumaos/dpiclass.bin"
          test -f "$work_dir/data/usr/lib/dumaos/libnetfilter_queue.so.1"
          test -f "$work_dir/data/usr/lib/detectlist.xor"
          test -f "$work_dir/data/usr/lib/dumaos/lib/nfqverdict-shim.so"
          test -x "$work_dir/data/usr/lib/dumaos/bin/openssl"
          grep -q nfqverdict-shim.so "$work_dir/data/usr/bin/dpiclass"

          # MR22 ubus stack is staged privately and activated transactionally.
          for f in ubus.so libubus.so libubox.so ubusd ubus; do
            test -f "$work_dir/data/usr/lib/dumaos/platform/mr22/$f"
          done
          test -x "$work_dir/data/usr/lib/dumaos/platform/ubus-stack.sh"
          test ! -e "$work_dir/data/etc/uhttpd.key"
          test ! -e "$work_dir/data/etc/uhttpd.crt"
          test ! -e "$work_dir/data/bin/tar"
          test ! -e "$work_dir/data/usr/bin/openssl"
          test ! -e "$work_dir/data/usr/bin/wl"
          test ! -e "$work_dir/data/usr/sbin/conntrack"
          ! grep -R -Eq '>>[[:space:]]*/etc/ld\.so\.preload' "$work_dir/data" "$work_dir/control"
          test -f "$work_dir/data/dumaossystem/version"
          test -x "$work_dir/data/usr/bin/dpiclass"
          test -x "$work_dir/data/usr/bin/luac"
          test -x "$work_dir/data/usr/bin/luac5.1"

          (
            cd dist
            sha256sum "${{ steps.package.outputs.package_name }}" > \
              "${{ steps.package.outputs.package_name }}.sha256"
          )
          (
            cd "$work_dir/data"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > \
              "$GITHUB_WORKSPACE/dist/${{ steps.package.outputs.package_name }}.files.sha256"
          )

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dumaos-repack-ipk
          path: |
            dist/${{ steps.package.outputs.package_name }}
            dist/${{ steps.package.outputs.package_name }}.sha256
            dist/${{ steps.package.outputs.package_name }}.files.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/dumaos-repack-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Download built package
        uses: actions/download-artifact@v8
        with:
          name: dumaos-repack-ipk
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.package_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
            "dist/$PACKAGE_NAME" "dist/$PACKAGE_NAME.sha256" \
            "dist/$PACKAGE_NAME.files.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
            "dist/$PACKAGE_NAME" "dist/$PACKAGE_NAME.sha256" \
            "dist/$PACKAGE_NAME.files.sha256" \
              --verify-tag --generate-notes
          fi
