name: Build openssl 1.1 ARM
on:
  push:
    paths:
      - .github/workflows/build-openssl.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi
      - name: Download and build openssl 1.1.1w (static)
        run: |
          wget -q https://www.openssl.org/source/old/1.1.1/openssl-1.1.1w.tar.gz
          tar xzf openssl-1.1.1w.tar.gz
          cd openssl-1.1.1w
          ./Configure linux-armv4 no-shared no-async no-zlib no-engine no-comp no-dso threads -static --cross-compile-prefix=arm-linux-gnueabi- --prefix=/opt/openssl
          make -j4 build_generated
          make -j4 LDFLAGS="-static -static-libgcc" apps/openssl
          arm-linux-gnueabi-strip apps/openssl
          file apps/openssl
          cp apps/openssl ../openssl-1.1.1w-arm-static
          cd ..
      - uses: actions/upload-artifact@v4
        with:
          name: openssl-1.1.1w-arm
          path: openssl-1.1.1w-arm-static
